<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <title>FitLife | IMC</title>
</head>
<body>

    <nav>

        <a href="../index.html" class="logo">
            <i class="fas fa-heartbeat"></i>
            FitLife
        </a>

        <ul class="links-nav">
            <li><a href="../index.html" class="link-nav">Home</a></li>
            <li><a href="imc.html" class="link-nav ativo">IMC</a></li>
            <li><a href="tmb.html" class="link-nav">TMB</a></li>
            <li><a href="water.html" class="link-nav">Água</a></li>
        </ul>

    </nav>

    <main class="pagina-ferramenta">

        <section class="container-ferramenta">

            <header class="titulo-ferramenta">
                <i class="fas fa-weight"></i>
                <h1>Cálculo de IMC</h1>
            </header>

            <form action="#" method="GET">

                <div class="grupo-form">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" step="0.1" placeholder="Ex: 70" required>
                </div>

                <div class="grupo-form">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" name="altura" step="0.01" placeholder="Ex: 1.75" required>
                </div>

                <button type="submit" class="botao">Calcular</button>
                <a href="../index.html" class="botao botao-voltar">Voltar</a>

            </form>

            <div class="caixa-resultado">
                <p>Seu IMC é:</p>
                <h2>00.0</h2>
                <p>Classificação</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 FitLife · <a href="../about.html">Sobre</a> · <a href="profile.html">Perfil</a></p>
    </footer>

</body>
</html>
