<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">

    <title>Cálculo de IMC</title>
</head>
<body>

    <nav>

        <a href="../index.html">
            Fitlife
        </a>

        <ul>
            <a href="imc.html">
                <li>Calculadora de IMC</li>
            </a>

            <a href="tmb.html">
                <li>Taxa metabólica basal</li>
            </a>

            <a href="water.html">
                <li>Controle de hidratação</li>
            </a>

            <a href="profile.html">
                <li>Meu perfil</li>
            </a>

            <a href="../about.html">
                <li>Saiba mais</li>
            </a>
        </ul>

    </nav>

    <main>

        <section>

            <header>
                <h1>Cálculo de IMC</h1>
                <img src="../assets/imgs/imc.svg" alt="Ícone da calculadora de IMC">
            </header>

        </section>

            <form action="#" method="GET">

                <div>
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" step="0.1" placeholder="Ex: 70" required>
                </div>

                <div>
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" name="altura" step="0.01" placeholder="Ex: 1.75" required>
                </div>

                <button type="submit">Calcular</button>

            </form>

            <div>
                <p>Seu IMC é:</p>
                <h2>00.0</h2>
                <p>Classificação</p>
            </div>

            <p>
                <a href="../index.html">Voltar</a>
            </p>

    </main>

    <footer>
        <p>© 2026 FitLife</p>
    </footer>

</body>
</html>
