<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <title>FitLife | Perfil</title>
</head>
<body>

    <nav>

        <a href="../index.html" class="logo">
            <i class="fas fa-heartbeat"></i>
            FitLife
        </a>

        <ul class="links-nav">
            <li><a href="../index.html" class="link-nav">Home</a></li>
            <li><a href="imc.html" class="link-nav">IMC</a></li>
            <li><a href="tmb.html" class="link-nav">TMB</a></li>
            <li><a href="water.html" class="link-nav">Água</a></li>
        </ul>

    </nav>

    <main class="pagina-ferramenta">

        <section class="container-ferramenta">

            <header class="titulo-ferramenta">
                <i class="fas fa-user"></i>
                <h1>Meu <span>Perfil</span></h1>
            </header>

            <form action="#" method="GET">

                <div class="grupo-form">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>
                </div>

                <div class="grupo-form">
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" name="idade" placeholder="Ex: 25" required>
                </div>

                <div class="grupo-form">
                    <label for="objetivo">Objetivo</label>
                    <select id="objetivo" name="objetivo" required>
                        <option value="">Selecione</option>
                        <option value="emagrecer">Emagrecer</option>
                        <option value="manter">Manter o peso</option>
                        <option value="ganhar">Ganhar massa</option>
                    </select>
                </div>

                <button type="submit" class="botao">Salvar</button>
                <a href="../index.html" class="botao botao-voltar">Voltar</a>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 FitLife · <a href="../about.html">Sobre</a> · <a href="profile.html">Perfil</a></p>
    </footer>

</body>
</html>
