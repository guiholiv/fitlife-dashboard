<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <title>FitLife | TMB</title>
</head>
<body>

    <nav>

        <a href="../index.html" class="logo">
            <i class="fas fa-heartbeat"></i>
            FitLife
        </a>

        <ul class="links-nav">
            <li><a href="../index.html" class="link-nav">Home</a></li>
            <li><a href="imc.html" class="link-nav">IMC</a></li>
            <li><a href="tmb.html" class="link-nav ativo">TMB</a></li>
            <li><a href="water.html" class="link-nav">Água</a></li>
        </ul>

    </nav>

    <main class="pagina-ferramenta">

        <section class="container-ferramenta">

            <header class="titulo-ferramenta">
                <i class="fas fa-fire"></i>
                <h1>Taxa Metabólica</h1>
            </header>

            <form action="#" method="GET">

                <div class="grupo-form">
                    <label for="gender">Sexo</label>
                    <select id="gender" name="gender" required>
                        <option value="">Selecione</option>
                        <option value="male">Masculino</option>
                        <option value="female">Feminino</option>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" placeholder="Ex: 70" required>
                </div>

                <div class="grupo-form">
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" name="altura" placeholder="Ex: 175" required>
                </div>

                <div class="grupo-form">
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" name="idade" placeholder="Ex: 25" required>
                </div>

                <button type="submit" class="botao">Calcular calorias</button>
                <a href="../index.html" class="botao botao-voltar">Voltar</a>

            </form>

            <div class="caixa-resultado">
                <p>Gasto calórico basal:</p>
                <h2>0000</h2>
                <p>Kcal/dia</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 FitLife · <a href="../about.html">Sobre</a> · <a href="profile.html">Perfil</a></p>
    </footer>

</body>
</html>
