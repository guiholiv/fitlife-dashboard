<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">

    <title>Taxa Metabólica Basal</title>
</head>
<body>

    <nav>

        <a href="../index.html">
            Fitlife
        </a>

        <ul>
            <a href="imc.html">
                <li>Calculadora de IMC</li>
            </a>

            <a href="tmb.html">
                <li>Taxa metabólica basal</li>
            </a>

            <a href="water.html">
                <li>Controle de hidratação</li>
            </a>

            <a href="profile.html">
                <li>Meu perfil</li>
            </a>

            <a href="../about.html">
                <li>Saiba mais</li>
            </a>
        </ul>

    </nav>

    <main>

        <section>

            <header>
                <h1>Taxa Metabólica Basal</h1>
                <img src="../assets/imgs/tmb.svg" alt="Ícone da calculadora de Taxa Metabólica Basal">
            </header>

        </section>

            <form action="#" method="GET">

                <div>
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                    </select>
                </div>

                <div>
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" placeholder="Ex: 70" required>
                </div>

                <div>
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" name="altura" placeholder="Ex: 175" required>
                </div>

                <div>
                    <label for="idade">Idade (anos)</label>
                    <input type="number" id="idade" name="idade" placeholder="Ex: 25" required>
                </div>

                <button type="submit">Calcular calorias</button>

            </form>

            <div>
                <p>Gasto calórico basal:</p>
                <h2>0000</h2>
                <p>Kcal/dia</p>
            </div>

            <p>
                <a href="../index.html">Voltar</a>
            </p>

    </main>

    <footer>
        <p>© 2026 FitLife</p>
    </footer>

</body>
</html>
